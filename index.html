<style>
  html, body {
    margin: 0; padding: 0; background: #0b0a08;
    width: 100%; height: 100%;
    overflow: hidden;                 /* no page scroll, no horizontal scroll */
    overscroll-behavior: none;        /* no rubber-band on the body */
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;       /* DOM controls work; canvas owns its gestures */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;      /* no long-press callout over the canvas */
    -webkit-tap-highlight-color: transparent;
  }
  /* 100dvh tracks the iOS Safari toolbar as it shows/hides; fall back to 100%. */
  /* Phaser's autoCenter positions the canvas inside #game with margins;
     #game itself must NOT also flex-centre it or the offset doubles. */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; display: block; }
  canvas { image-rendering: auto; display: block; touch-action: none; }
  /* Fullscreen: the game box owns the monitor / phone display. */
  :fullscreen, :-webkit-full-screen { background: #0b0a08; width: 100%; height: 100%; }
  #game:fullscreen, #game:-webkit-full-screen {
    width: calc(100dvw - var(--adv-safe-left) - var(--adv-safe-right)) !important;
    height: calc(100dvh - var(--adv-safe-top) - var(--adv-safe-bottom)) !important;
  }

  /* DOM text fields overlaid on the canvas (canvas text can't summon a
     software keyboard). Positioned by ADV.UI.textField in game-space units. */
  .adv-field {
    position: absolute; box-sizing: border-box; z-index: 40;
    background: #211d18; color: #e8e0d0; border: 1px solid #5a4e3c; border-radius: 4px;
    font-family: Georgia, 'Times New Roman', serif; font-size: 16px; /* >=16px: iOS won't zoom */
    text-align: center; outline: none; padding: 0 8px; margin: 0;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
    pointer-events: auto;
    -webkit-appearance: none; appearance: none;
  }
  .adv-field:focus { border-color: #c8a24a; }
  .adv-field.adv-purple { color: #b48ee0; }

  /* Landscape-only: on a phone held upright, ask for a turn. Dismisses itself
     the moment the viewport is wider than it is tall. */
  #rotate {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: #0b0a08; color: #d8cdb8; text-align: center;
    font-family: Georgia, serif; padding: 0 24px;
    flex-direction: column; justify-content: center; align-items: center; gap: 18px;
  }
  #rotate .icon { width: 64px; height: 112px; border: 3px solid #c8a24a; border-radius: 10px;
                  animation: advturn 1.6s ease-in-out infinite; }
  #rotate .t { font-size: 20px; color: #e7b450; letter-spacing: 1px; }
  #rotate .s { font-size: 14px; color: #8b7d6b; }
  @keyframes advturn { 0%,25% { transform: rotate(0deg); } 60%,100% { transform: rotate(90deg); } }

  #adv-live-update {
    display: none; position: fixed; inset: 0; z-index: 10000;
    background: rgba(11, 10, 8, 0.92); color: #e8e0d0;
    font-family: Georgia, 'Times New Roman', serif;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 28px 24px;
  }
  #adv-live-update.show { display: flex; }
  #adv-live-update h1 { color: #e7b450; font-size: 26px; letter-spacing: 0.5px; margin: 0 0 18px; }
  #adv-live-update p { font-size: 16px; line-height: 1.5; max-width: 520px; margin: 0 0 28px; color: #d8cdb8; }
  #adv-live-update button {
    background: #211d18; color: #e8e0d0; border: 1px solid #c8a24a; border-radius: 4px;
    font-family: Georgia, 'Times New Roman', serif; font-size: 16px;
    padding: 12px 52px; cursor: pointer;
  }
  #adv-live-update button:focus { outline: 2px solid #c8a24a; }
</style>

<script>
(async function () {
await ADV.Portal.prepare();
const params = new URLSearchParams(location.search);
const seed = params.has('seed') ? Number(params.get('seed')) : undefined;
window.__game = new Phaser.Game({
  type: (location.protocol === 'file:' || params.get('renderer') === 'canvas') ? Phaser.CANVAS : Phaser.AUTO,
  parent: 'game',
  width: ADV.T.W,
  height: ADV.T.H,
  backgroundColor: '#171512',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, fullscreenTarget: document.getElementById('game') },
  input: { activePointers: 3 },
  scene: [],
});
window.__game.scene.add('Inn', ADV.ExpeditionInnScene, false);
window.__game.scene.add('Travel', ADV.ExpeditionTravelScene, false);
window.__game.scene.add('Grave', ADV.ExpeditionGraveScene, false);
window.__game.scene.add('End', ADV.ExpeditionEndScene, false);
window.__game.scene.add('Expedition', ADV.ExpeditionScene, false);
// Resume where the run left off; a fresh run opens straight into the ambush.
// ?fresh=1 is a true restart: the stored run is wiped, so nothing — least of all
// the tutorial's 'already seen' flags — can bleed into the new one. The same
// shortcuts are available in the game itself (js/expedition/dev.js), which is how
// they are meant to be used; these parameters exist for the automated tests.
let run = params.has('fresh') ? ADV.Expedition.Run.reset() : ADV.Expedition.Run.load();
if (params.get('at') === 'inn') {
  run = ADV.Expedition.Dev.innRun(params.has('score') ? Number(params.get('score')) : params.has('gold') ? Number(params.get('gold')) : 1500);
}
const phase = run ? run.phase : 'quest';
const start = phase === 'inn' ? 'Inn' : phase === 'travel' ? 'Travel' : phase === 'grave' ? 'Grave' : phase === 'end' ? 'End' : 'Expedition';
window.__game.scene.start(start, { seed, fresh: params.has('fresh'), run: run || undefined, leg: run && run.travelLeg });
// Start over reloads with ?fresh=1, so take it back out of the address bar once
// it has done its job: otherwise every later refresh would wipe the run too.
if (params.has('fresh')) {
  try { const u = new URL(location.href); u.searchParams.delete('fresh'); history.replaceState(null, '', u.toString()); } catch (e) {}
}
if (ADV.MobileViewport) { window.__mobileViewport = ADV.MobileViewport.install(window, document, window.__game); window.__refit = window.__mobileViewport.schedule; }
ADV.Portal.attach(window.__game);
})();
</script>
