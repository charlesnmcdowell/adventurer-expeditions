<script>(async()=>{const X=ADV.Expedition,S=X.Story;S.Presentation.configure(await fetch('assets/expedition/story/campaign.json').then(r=>r.json()));const record=S.load();if(!record||record.phase!=='combat')throw Error('No campaign battle is pending');const missing=S.readiness(S.open(record));if(missing.length)throw Error('Combat art is not ready: '+missing.join(', '));const game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1280,height:760,backgroundColor:'#080b15',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[]});game.scene.add('StoryBattle',X.StoryBattle,true,{record,muted:new URLSearchParams(location.search).get('muted')!=='0'});window.storyGame=game;})().catch(e=>{document.getElementById('game').textContent=e.message;console.error(e);});</script></body></html>
