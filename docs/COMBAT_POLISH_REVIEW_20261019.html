<script>(async()=>{const X=ADV.Expedition,S=X.Story;S.Presentation.configure(await fetch('assets/expedition/story/campaign.json').then(r=>r.json()));S.save=()=>{};X.Run.save=()=>{};
const which=new URLSearchParams(location.search).get('case')||'archers';
const pilot=S.open(S.fresh());Object.assign(pilot.record,{chapter:which==='archers'?7:10,encounter:which==='grell'?2:which==='rennick'?1:0,phase:'combat'});pilot.record.run.tutorial.skipGuide=true;S.syncQuest(pilot);
if(which==='archers'){for(const id of ['ithrel','faelen']){ADV.Campaign3.recruit(pilot.game,id);S.Companions.register(id,await fetch('assets/expedition/companion_'+id+'/companion_'+id+'.json').then(r=>r.json()));}S.Companions.select(pilot,['ithrel','faelen']);}
const record=pilot.record;X.StoryBattle.prototype.fight=async function(){await this.intro(false);window.reviewScene=this;document.getElementById('status').textContent='Ready — isolated demo; your save is unchanged.';};
document.getElementById('case').value=which;document.getElementById('case').onchange=e=>location.search='?case='+e.target.value;
window.reviewAction=async action=>{
 const s=window.reviewScene;if(!s||window.reviewBusy)return;window.reviewBusy=true;document.getElementById('status').textContent='Playing...';
 try{
  X.UI.resetCamera(s);X.fx.cinematics=true;
  for(const a of s.actors.values()){a.unit.chp=a.unit.maxHp;a.unit.downed=false;a.restoreFromFade();a.root.setPosition(a.home.x,a.home.y);}
  const foe=[...s.actors.values()].find(a=>a.side==='b'),named=[...s.actors.values()].find(a=>a.unit.ch.storyOpponent==='named:'+which);
  if(which==='archers'){
   const [id,skill]=action.split(':');const a=[...s.actors.values()].find(a=>a.unit.ch.expeditionStoryCompanion===id);
   await X.Beats.play(s,{events:[{t:'use',uid:a.uid,target:foe.uid,skillId:skill},{t:'damage',uid:foe.uid,by:a.uid,dmg:6}]});
  }else if(action==='rise'){
   named.unit.chp=Math.round(named.unit.maxHp*.3);
   await X.Beats.ticksOnly(s,[{t:'down',uid:named.uid},{t:'revive',uid:named.uid,by:named.uid,skillId:'shadow_rise'}]);
  }else if(action==='entrance')await named.play('entrance');
  else if(which==='grell')await X.Beats.play(s,{events:[{t:'use',uid:named.uid,target:s.hero.uid,skillId:'backstab'},{t:'damage',uid:s.hero.uid,by:named.uid,dmg:3}]});
  else{
   X.finisherLast.story_rennick=action==='pair1'?'hiro-finisher-2':'hiro-finisher-1';named.unit.chp=0;named.unit.downed=true;
   await X.Beats.play(s,{hero:true,choice:{how:'cast',action:{skillId:'finisher'}},events:[{t:'use',uid:s.hero.uid,target:named.uid,skillId:'finisher'},{t:'execute',uid:named.uid,by:s.hero.uid},{t:'down',uid:named.uid}]});
  }
 }catch(e){console.error(e);document.getElementById('status').textContent=e.message;return;}
 finally{window.reviewBusy=false;X.UI.resetCamera(s);}
 document.getElementById('status').textContent='Ready — replay or choose another scene.';
};
const actions=which==='archers'?[['ithrel:aimed_shot','Itsuki: sky volley'],['ithrel:snare','Itsuki: pinning shot'],['faelen:backstab','Kaito: flip + triple shot'],['faelen:basic_attack','Kaito: basic shot']]:which==='grell'?[['entrance','Hood-off entrance'],['shot','Kneeling crossbow'],['rise','Shadow Rise']]:[['pair1','Finisher 1'],['pair2','Finisher 2'],['rise','Shadow Rise']];
for(const [id,label]of actions){const b=document.createElement('button');b.textContent=label;b.onclick=()=>reviewAction(id);document.getElementById('actions').append(b);}
if(!record||record.phase!=='combat')throw Error('No campaign battle is pending');await S.Companions.ensure(S.open(record));const missing=S.readiness(S.open(record));if(missing.length)throw Error('Combat art is not ready: '+missing.join(', '));const game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1280,height:760,backgroundColor:'#080b15',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[]});game.scene.add('StoryBattle',X.StoryBattle,true,{record,muted:new URLSearchParams(location.search).get('muted')!=='0'});window.storyGame=game;})().catch(e=>{document.getElementById('game').textContent=e.message;console.error(e);});</script></body></html>
