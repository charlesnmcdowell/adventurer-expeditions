<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Expeditions · visual review</title>
<style>
[hidden]{display:none!important}:root{color-scheme:dark;font:15px/1.5 system-ui;background:#10131c;color:#ececf2}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #33394e;display:flex;gap:15px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0}header p{margin:0;color:#aab4c9}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;padding:20px;max-width:1650px;margin:auto}aside{min-width:0}main{min-width:0}button,select,textarea,input{font:inherit}button,select,textarea{border:1px solid #49516d;background:#202637;color:inherit;border-radius:7px;padding:9px 12px}button,select{min-height:44px}button{cursor:pointer}button:hover{background:#353e59}button:disabled{opacity:.4;cursor:wait}button.active{border-color:#c4a3ff;background:#403052}select,textarea{width:100%}label{display:block;margin:8px 0;color:#bfc7dc}.list{max-height:64dvh;overflow:auto;margin-top:12px}.list button{width:100%;text-align:left;margin-bottom:5px;font-size:14px}.list small{display:block;color:#aab3c7;font-size:11px}.viewport{position:relative;background:#161b26;aspect-ratio:1280/760;overflow:hidden;border:1px solid #46506a;border-radius:10px}#game{position:absolute;inset:0}canvas{display:block}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#111722e8;z-index:2}#loading[hidden]{display:none}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.row select{width:auto}h2{margin:0;font-size:20px}code{color:#d8bdff}.muted{color:#aab4c9;font-size:13px}.warning{background:#332b20;border-left:3px solid #e7bc72;padding:10px 14px;border-radius:4px;margin:12px 0}input[type=range]{width:100%;accent-color:#c1a0ee}textarea{min-height:88px;resize:vertical}.feedback{padding:15px;border:1px solid #414964;border-radius:10px;margin-top:16px}.feedback label{display:inline-block;margin:0 12px 8px 0}.feedback input{accent-color:#c1a0ee}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}a{color:#d0b2ff}#status{min-height:24px}.empty{padding:15px;color:#aab4c9}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}.legend{margin:8px 0}.file{overflow-wrap:anywhere}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e9c478;outline-offset:2px}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:12px;gap:12px}.list{max-height:160px}header{padding:12px}.filters{display:flex;gap:8px}.filters label{flex:1}.title{align-items:flex-start}.row{gap:5px}.row button{padding:7px 9px}}
</style></head><body>
<header><h1>Expeditions · visual review</h1><p>Watch → step through → mark what needs work</p><span id="total" class="muted"></span></header>
<div class="layout"><aside><div class="filters"><label>Location<select id="location"><option value="all">All locations</option><option value="forest">Forest / road / mountain</option><option value="swamp">Swamp</option><option value="city">City</option><option value="coast">Coast</option><option value="citadel">Arcane Citadel</option></select></label><label>Show<select id="kind"><option value="all">Everything</option><option value="background">Battle scenery</option><option value="travel">Full travel scenes</option><option value="action">Obstacle action poses</option><option value="run">Hiro's run</option><option value="hero">Hiro finishers</option><option value="enemy">Enemy finishers on Hiro</option><option value="marked">My marked items</option></select></label></div><nav id="items" class="list" aria-label="Review items"></nav><p class="muted">Only the selected item plays. This page never starts a game run or writes your save.</p><div class="row"><button id="copy">Copy feedback</button><button id="download">Download feedback</button></div><div id="status" role="status" class="muted"></div></aside>
<main><div class="title"><div><code id="id"></code><h2 id="title"></h2></div><div><button id="previousItem" aria-label="Previous item">← Item</button><button id="nextItem">Item →</button></div></div>
<div class="viewport"><div id="game"></div><div id="loading">Loading review…</div></div>
<div id="known" class="warning" hidden></div><div class="row"><button id="play">Pause</button><button id="replay">Replay</button><button id="previousFrame">← Frame</button><button id="nextFrame">Frame →</button><select id="speed" aria-label="Playback speed"><option value="1">1× speed</option><option value="0.5">½ speed</option><option value="0.25">¼ speed</option></select><label><input id="loop" type="checkbox" checked> Loop</label><label id="ghostLabel"><input id="ghost" type="checkbox"> Previous pose ghost</label></div>
<input id="scrub" aria-label="Animation timeline" type="range" min="0" max="1" step="1" value="0"><div id="position" class="muted legend"></div>
<div class="row"><label id="weatherLabel">Weather <select id="weather"><option value="authored">As in game</option><option value="clear">Clear</option><option value="rain">Rain</option><option value="storm">Storm</option><option value="snow">Snow</option></select></label><button id="related">View full journey</button><button id="capture">Save this frame</button><button id="link">Copy item link</button></div>
<p id="modeNote" class="muted"></p><p id="file" class="muted file"></p>
<div class="feedback"><label><input id="rework" type="checkbox"> Needs rework</label><label><input id="remove" type="checkbox"> Request removal</label><button id="cite">Add current frame to note</button><textarea id="note" aria-label="Feedback" placeholder="What looks wrong? Mention the pose, contact, scale, background layer, or timing."></textarea><p class="muted">Notes save in this browser. Marking an item changes no game content. Copy or download your list and send it to me.</p></div>
</main></div>

<script>window.REVIEW_ENTRIES=/* REVIEW_DATA */;</script><script src="docs/art_review.js?v=20261010-pairs-v7"></script></body></html>
