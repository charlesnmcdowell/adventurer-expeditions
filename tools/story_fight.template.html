<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Campaign battle</title><link rel="icon" type="image/png" href="assets/app/icon-192.png">
<style>html,body{margin:0;width:100%;height:100%;background:#05070c;overflow:hidden}#game{width:100%;height:100%}.art-warning{position:fixed;inset:25%;background:#172033;color:white;font:20px system-ui;padding:30px;z-index:20}</style></head><body><div id="game"></div>
<!-- MODULES -->
<script src="js/expedition/story.js"></script><script src="js/expedition/story_dialogue.js"></script><script src="js/expedition/story_combat.js"></script><script src="js/expedition/story_companions.js"></script><script src="js/expedition/story_presentation.js"></script><script src="js/expedition/story_art.js"></script><script src="js/expedition/story_stage.js"></script><script src="js/expedition/story_effects.js"></script><script src="js/expedition/story_scene.js"></script>
<script>(async()=>{const X=ADV.Expedition,S=X.Story;S.Presentation.configure(await fetch('assets/expedition/story/campaign.json').then(r=>r.json()));const record=S.load();if(!record||record.phase!=='combat')throw Error('No campaign battle is pending');const missing=S.readiness(S.open(record));if(missing.length)throw Error('Combat art is not ready: '+missing.join(', '));const game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1280,height:760,backgroundColor:'#080b15',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[]});game.scene.add('StoryBattle',X.StoryBattle,true,{record,muted:new URLSearchParams(location.search).get('muted')!=='0'});window.storyGame=game;})().catch(e=>{document.getElementById('game').textContent=e.message;console.error(e);});</script></body></html>
